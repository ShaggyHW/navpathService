[package]
name = "navpath-service"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
thiserror = "1"
anyhow = "1"
navpath-core = { path = "../navpath-core" }
arc-swap = "1"
lru = "0.12"
rustc-hash = "2"
mimalloc = { version = "0.1", default-features = false }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
http-body-util = "0.1"
navpath-core = { path = "../navpath-core", features = ["builder"] }
