[package]
name = "navpath-core"
version = "0.1.0"
edition = "2021"

[dependencies]
memmap2 = "0.9"
byteorder = "1"
thiserror = "1"
libc = "0.2"
blake3 = { version = "1", optional = true }

[dev-dependencies]
tempfile = "3"
# Plotting is unused (perf-gate passes --noplot and reads estimates.json), so skip the
# plotters dependency tree.
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support", "rayon"] }
serde_json = "1"
# Harnesses (bench + examples) run under the production allocator, not glibc malloc.
mimalloc = { version = "0.1", default-features = false }

[features]
default = []
builder = ["blake3"]
# Escape hatch for deliberately portable (baseline x86-64) builds; without it, building
# on x86_64 without -C target-cpu=native/x86-64-v3 is a compile error (see src/lib.rs).
allow-baseline-cpu = []

[[bench]]
name = "astar"
harness = false
